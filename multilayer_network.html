<div id="controls">

    <option value="grid">Grid</option>

    <option value="tf">TF → Gene only</option>
    <option value="mirna">miRNA → Gene only</option>

</div>

: "TFAP2C", "target": "KDM4A", "layer": "tf"}}, {"data": {"source": "TFAP2C", "target": "INTS7", "layer": "tf"}}, {"data": {"source": "TFAP2C", "target": "MRPS9", "layer": "tf"}}, {"data": {"source": "TFAP2C", "target": "NOL10", "layer": "tf"}}, {"data": {"source": "TFAP2C", "target": "TRAF3IP3", "layer": "tf"}}, {"data": {"source": "TFAP2C", "target": "ZNF687", "layer": "tf"}}, {"data": {"source": "TFAP2C", "target": "CENPS", "layer": "tf"}}, {"data": {"source": "TFAP2C", "target": "MRPS14", "layer": "tf"}}, {"data": {"source": "TFAP2C", "target": "WDR75", "layer": "tf"}}];

const layerColors = {
  gene:       '#5eead4',
  tf:         '#fbbf24',
  mirna:      '#a78bfa',
  metabolite: '#34d399'
};
const edgeColors = {
  ppi:        '#5eead4',
  tf:         '#fb923c',
  mirna:      '#c084fc',
  metabolite: '#6ee7b7'
};

const cy = cytoscape({
  container: document.getElementById('cy'),
  pixelRatio: window.devicePixelRatio || 2,
  elements: elements,
  style: [
    {
      selector: 'node',
      style: {
        'background-color': (n) => {
          const stab = n.data('stability');
          if (stab === '100') return '#f87171';
          if (stab === 'high') return '#fb923c';
          return layerColors[n.data('layer')] || '#94a3b8';
        },
        'border-width': (n) => {
          const stab = n.data('stability');
          return (stab === '100' || stab === 'high') ? 3 : 1.5;
        },
        'border-color': (n) => {
          const stab = n.data('stability');
          if (stab === '100') return '#fbbf24';
          if (stab === 'high') return '#fb923c';
          return layerColors[n.data('layer')] || '#475569';
        },
        'label': 'data(label)',
        'color': '#1e293b',
        'font-size': (n) => {
          const layer = n.data('layer');
          if (layer === 'gene') return 14;
          if (layer === 'tf')   return 13;
          return 12;
        },
        'font-weight': (n) => n.data('layer') === 'gene' ? 'bold' : 'normal',
        'text-valign': 'bottom',
        'text-halign': 'center',
        'text-margin-y': 5,
        'text-background-color': '#f8fafc',
        'text-background-opacity': 0.85,
        'text-background-padding': '3px',
        'text-background-shape': 'roundrectangle',
        'width': (n) => {
          const layer = n.data('layer');
          const stab  = n.data('stability');
          if (stab === '100') return 36;
          if (stab === 'high') return 30;
          if (layer === 'gene') return 26;
          if (layer === 'tf')   return 22;
          return 18;
        },
        'height': (n) => {
          const layer = n.data('layer');
          const stab  = n.data('stability');
          if (stab === '100') return 36;
          if (stab === 'high') return 30;
          if (layer === 'gene') return 26;
          if (layer === 'tf')   return 22;
          return 18;
        },
        'shape': (n) => {
          const layer = n.data('layer');
          if (layer === 'tf')         return 'diamond';
          if (layer === 'mirna')      return 'triangle';
          if (layer === 'metabolite') return 'round-rectangle';
          return 'ellipse';
        }
      }
    },
    {
      selector: 'edge',
      style: {
        'line-color':    (e) => edgeColors[e.data('layer')] || '#475569',
        'target-arrow-color': (e) => edgeColors[e.data('layer')] || '#475569',
        'target-arrow-shape': (e) => e.data('layer') === 'ppi' ? 'none' : 'triangle',
        'curve-style':   'bezier',
        'width':         1.2,
        'opacity':       0.55
      }
    },
    {
      selector: 'node:selected',
      style: {
        'border-width': 4,
        'border-color': '#ffffff',
        'opacity': 1
      }
    },
    {
      selector: 'edge:selected',
      style: { 'width': 3, 'opacity': 1 }
    }
  ],
  layout: { name: 'concentric',
             concentric: (n) => {
               const order = { gene: 4, tf: 3, mirna: 2, metabolite: 1 };
               return order[n.data('layer')] || 1;
             },
             levelWidth: () => 4,
             padding: 60,
             minNodeSpacing: 20 }
});

// ── Tooltip ───────────────────────────────────────────────────────────────────
const tip = document.getElementById('tooltip');
cy.on('mouseover', 'node', function(e) {
  const n = e.target;
  const d = n.data();
  const layerLabel = { gene: 'Candidate gene', tf: 'Transcription factor',
                        mirna: 'miRNA', metabolite: 'Metabolite' };
  const stab = d.stability
    ? `<br><b>Stability:</b> ${d.stability === '100' ? '100% (sPLS-DA)' :
                               d.stability === 'high' ? 'High (≥89%)' : 'Candidate'}`
    : '';
  const deg = n.degree(false);
  tip.innerHTML = `<b>${d.label}</b><br><b>Layer:</b> ${layerLabel[d.layer] || d.layer}${stab}<br><b>Edges:</b> ${deg}`;
  tip.style.display = 'block';
});
cy.on('mousemove', function(e) {
  const pos = e.renderedPosition || e.position;
  const cont = document.getElementById('cy').getBoundingClientRect();
  tip.style.left = (cont.left + pos.x + 14) + 'px';
  tip.style.top  = (cont.top  + pos.y - 10) + 'px';
});
cy.on('mouseout', 'node', () => tip.style.display = 'none');

// ── Highlight neighbours on click ────────────────────────────────────────────
cy.on('tap', 'node', function(e) {
  const node  = e.target;
  const nb    = node.closedNeighborhood();
  const rest  = cy.elements().not(nb);
  rest.style('opacity', 0.15);
  nb.style('opacity', 1);
});
cy.on('tap', function(e) {
  if (e.target === cy) cy.elements().style('opacity', 1);
});

// ── Layout selector ───────────────────────────────────────────────────────────
function runLayout() {
  const val = document.getElementById('layoutSel').value;
  const opts = {
    cose:        { name: 'cose', animate: true, nodeRepulsion: 8000,
                   idealEdgeLength: 80, edgeElasticity: 0.45, padding: 40 },
    concentric:  { name: 'concentric',
                   concentric: (n) => {
                     const order = { gene: 4, tf: 3, mirna: 2, metabolite: 1 };
                     return order[n.data('layer')] || 1;
                   },
                   levelWidth: () => 4, padding: 60, minNodeSpacing: 20 },
    grid:        { name: 'grid', padding: 40, rows: 6 },
    breadthfirst:{ name: 'breadthfirst', roots: cy.nodes('[layer = "gene"]'),
                   padding: 40, spacingFactor: 1.2 }
  };
  cy.layout(opts[val] || opts.cose).run();
}

// ── Edge filter ───────────────────────────────────────────────────────────────
function filterEdges() {
  const val = document.getElementById('edgeSel').value;
  cy.edges().forEach(e => {
    e.style('display', val === 'all' || e.data('layer') === val ? 'element' : 'none');
  });
}
